services:
  foodbox-backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - TZ=Asia/Seoul
      - SLACK_TOKEN=${SLACK_TOKEN}
      - SLACK_CHANNEL=${SLACK_CHANNEL}
      - DB_FILE_DIR=/db
      - CRAWL_URL=${CRAWL_URL}
      - CLOVA_URL=${CLOVA_URL}
      - CLOVA_SECRET_KEY=${CLOVA_SECRET_KEY}
    volumes:
      - ./db:/db
    networks:
      - foodbox-network

  foodbox-frontend:
    build:
      context: ./front
      dockerfile: Dockerfile
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - foodbox-backend
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot
    networks:
      - foodbox-network

networks:
  foodbox-network:
    driver: bridge
